name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # PR runs read the cache but never write it, so a PR cannot poison main's cache.
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests (offline, no credentials)
        run: uv run pytest -q

      - name: dbt parse (no warehouse connection)
        env:
          SNOWFLAKE_ACCOUNT: ci-placeholder
          SNOWFLAKE_USER: ci-placeholder
          SNOWFLAKE_PRIVATE_KEY: ci-placeholder
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
